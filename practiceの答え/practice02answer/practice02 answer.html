<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title Here</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="practice02answer.css"
      media="all"
    />
  </head>
  <body>
    <!-- ヘッダー　ここから -->
    <header>
      <div class="header_wrapper">
        <div class="logo">
          <p>DesigNews</p>
        </div>
        <div class="download_btn">
          <a href="">ダウンロード</a>
        </div>
      </div>
    </header>
    <!-- ヘッダー　ここまで -->

    <main>
      <div id="fv">
        <div class="gray_wrapper">
          <div class="opacity"><!-- gray_wrapperとcontainerの間にopacityというレイヤーを追加。ここに透明な膜を作るイメージ。 -->
            <div class="container">
              <h1>DesigNews（デザインニュース）</h1>
              <h2>デザイナーのためだけのニュースアプリ</h2>
              <div class="big_btn">
                <a href="">ダウンロード</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="main_contents">
        <div class="container">
          <h2>デザイナー限定！デザイナー特化のニュースアプリ</h2>
          <div class="flex_wrapper">
            <img src="images/obi-onyeador-UEQvUtRs224-unsplash 1.png" alt="" />
            <p>
              現役デザイナーによる現役デザイナーに必要な最新情報をまとめた
              現役デザイナーのためのニュースアプリ。<br>
              最新のデザイントレンドからギャラリー展の紹介まで、デザイナーがほしい情報がまとめてチェックできます。
            </p>
          </div>
        </div>
      </div>

      <div id="bottom_contents">
        <div class="gray_wrapper">
          <div class="container">
            <h2>ダウンロード・利用料無料！すぐにチェックできる！</h2>
            <p>
                DesigNewsは無料でダウンロードできます。最新情報を今すぐチェックしましょう！
            </p>
            <h3>今すぐダウンロード！</h3>
            <div class="big_btn">
              <a href="">ダウンロード</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- フッター　ここから -->
    <footer>
      <p>©sample.com</p>
    </footer>
    <!-- フッター　ここまで -->
    <script type="text/javascript" src="assets/base.js"></script>
  </body>
</html>
